name: smart-shift-planner

x-database-client: &database-client
  DB_HOST: db
  DB_USER: timetable
  DB_NAME: timetable
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

x-application: &application
  image: ${API_IMAGE:?Load the API image from the recovery package}
  pull_policy: never

services:
  db:
    image: ${MYSQL_IMAGE:?Load the MySQL image from the recovery package}
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: timetable
      MYSQL_USER: timetable
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-/srv/smart-shift-planner/mysql}
        target: /var/lib/mysql
        bind:
          create_host_path: false
      - type: bind
        source: ${RESTORE_DIR:-/srv/smart-shift-planner/restore}
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 120s

  migrate:
    <<: *application
    command: ["node", "server/migrate.js"]
    environment:
      <<: *database-client
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Roster Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *application
    restart: unless-stopped
    environment:
      <<: *database-client
      HOST: 0.0.0.0
      TRUST_PROXY_HOPS: "1"
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact browser origin for the new host}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      ROSTER_TIMEZONE: ${ROSTER_TIMEZONE:-Asia/Kuala_Lumpur}
      WEBHOOK_ALLOWED_ORIGINS: ${WEBHOOK_ALLOWED_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *application
    command:
      - sh
      - -c
      - |
        if [ "$$ENABLE_WORKER" = "true" ]; then
          exec node server/worker.js
        else
          exec node -e 'console.log("Background work paused until ENABLE_WORKER=true after cutover."); setInterval(() => {}, 3600000)'
        fi
    restart: unless-stopped
    environment:
      <<: *database-client
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      ENABLE_WORKER: ${ENABLE_WORKER:-false}
      WEBHOOK_ALLOWED_ORIGINS: ${WEBHOOK_ALLOWED_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:?Load the web image from the recovery package}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
