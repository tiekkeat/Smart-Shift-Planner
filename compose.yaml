name: smart-timetable

x-database-client: &database-client
  DB_HOST: db
  DB_USER: timetable
  DB_NAME: timetable
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

x-application: &application
  image: smart-timetable-api:local
  build:
    context: .
    target: api

services:
  db:
    image: smart-timetable-mysql:8.4.13-bookworm
    build:
      context: .
      dockerfile: Dockerfile.mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: timetable
      MYSQL_USER: timetable
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 4s
      retries: 18

  migrate:
    <<: *application
    command: ["node", "server/migrate.js"]
    environment:
      <<: *database-client
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Roster Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *application
    restart: unless-stopped
    environment:
      <<: *database-client
      HOST: 0.0.0.0
      TRUST_PROXY_HOPS: "1"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      ROSTER_TIMEZONE: ${ROSTER_TIMEZONE:-Asia/Kuala_Lumpur}
      WEBHOOK_ALLOWED_ORIGINS: ${WEBHOOK_ALLOWED_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *application
    command: ["node", "server/worker.js"]
    restart: unless-stopped
    environment:
      <<: *database-client
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      WEBHOOK_ALLOWED_ORIGINS: ${WEBHOOK_ALLOWED_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  database:
